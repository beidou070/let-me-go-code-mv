<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; }
        #ch9-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      </style>
      <div data-hf-id="hf-f91r" id="root" data-composition-id="ch9" data-width="1920" data-height="1080">
        <canvas data-hf-id="hf-n453" id="ch9-canvas" width="1920" height="1080"></canvas>
      </div>
      <script>
        (function () {
          /* Chapter 9 — finale + end card (113.532 – 124.440)
           * 9a 113.53–120.12 "Let me do it…"    rooftop stage under the moon: the whole cast in a kickline (kicks on beats),
           *                                      confetti + sweeping spotlights; punch-in on 116.66, she spins twice, BIG POSE on 118.52
           *                                      with confetti cannons; camera pulls back to the whole cast posing
           * 9b 120.12–122.60 "and swing it all"  the pull-back keeps going — the whole show was a card inside the chat window.
           *                                      her reply: 「工具调用 0 次 · 歌曲 1 首」; the user types and sends 「……好吧，再唱一遍」
           * 9c 122.60–124.44 end card            iris opens on the title card: neon "Let Me Go" · （共创版）· 罐装毕加索 · credits,
           *                                      chibi her waving on the left, the whale icon spouting on the right
           */
          const L = LIB, C = CAST, P = L.P;
          const ID = "ch9", T0 = 113.532, T1 = 124.44;
          const TAU = Math.PI * 2;

          /* ================= shared bits ================= */
          const skyBg = (ctx, top = "#0b1034", mid = "#18205c", bot = "#2a3884") => {
            // radial from far below the frame: reads as a vertical sky gradient with a soft horizon curve,
            // and is ~2x cheaper to raster than a full-frame linear gradient
            const g = ctx.createRadialGradient(960, 2500, 1350, 960, 2500, 2700);
            g.addColorStop(0, bot);
            g.addColorStop(0.3, mid);
            g.addColorStop(1, top);
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, L.W, L.H);
          };
          const stars = (ctx, t, o) => {
            const n = o.n || 80, seed = o.seed || 1, x0 = o.x || 0, y0 = o.y || 0, w = o.w || L.W, h = o.h || L.H, a = o.a === undefined ? 1 : o.a;
            for (let i = 0; i < n; i++) {
              const x = x0 + L.hash(i * 3.1 + seed) * w, y = y0 + L.hash(i * 7.7 + seed * 2) * h;
              const tw = 0.5 + 0.5 * Math.sin(t * (1.2 + L.hash(i + seed) * 2.5) + i);
              const r = 1.2 + L.hash(i * 1.9 + seed) * 2.4;
              ctx.fillStyle = L.rgba("#e2eaff", (0.25 + 0.6 * tw) * a);
              L.circle(ctx, x, y, r);
              ctx.fill();
              if (r > 3.1) L.sparkle(ctx, x, y, r * 3.2 * tw, "#eef4ff", 0.8 * a);
            }
          };
          // moon with ONE merged halo gradient (C.moon + extra L.glow halos cost three large gradient fills per frame)
          const moon = (ctx, x, y, r) => {
            const R = r * 2.8;
            const g = ctx.createRadialGradient(x, y, r * 0.9, x, y, R);
            g.addColorStop(0, "rgba(236,242,255,0.42)");
            g.addColorStop(0.22, "rgba(190,210,255,0.2)");
            g.addColorStop(0.6, "rgba(159,184,255,0.06)");
            g.addColorStop(1, "rgba(159,184,255,0)");
            ctx.fillStyle = g;
            ctx.fillRect(x - R, y - R, 2 * R, 2 * R);
            L.circle(ctx, x, y, r);
            ctx.fillStyle = "#f4f1dc";
            ctx.fill();
            ctx.fillStyle = "rgba(200,190,160,0.35)";
            for (const [dx, dy, rr] of [[-0.3, -0.2, 0.18], [0.25, 0.1, 0.12], [-0.05, 0.35, 0.1]]) {
              L.circle(ctx, x + dx * r, y + dy * r, rr * r);
              ctx.fill();
            }
          };
          const CONF = [P.cyan, P.pink, P.json, P.mint, P.violet, P.amber, "#ffffff"];
          const confettiPiece = (ctx, x, y, i, t, sc = 1) => {
            const w = (12 + 8 * L.hash(i * 2.1)) * sc, h = (7 + 4 * L.hash(i * 4.3)) * sc;
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(t * (1.5 + 3 * L.hash(i * 5.7)) + i);
            ctx.scale(Math.cos(t * (4 + 5 * L.hash(i * 1.3)) + i), 1);
            ctx.fillStyle = CONF[i % CONF.length];
            ctx.fillRect(-w / 2, -h / 2, w, h);
            ctx.restore();
          };

          /* ================= the finale stage (used fullscreen in 9a and inside the chat card in 9b) ================= */
          const FEET = 850;
          const B = { spinIn: 116.657, spin0: 117.121, spin1: 118.05, pose: 118.515, kick0: 114.823 };
          const kickEnv = (t) => Math.exp(-5.5 * L.sinceBeat(t));
          const stageCam = (t) => {
            if (t < B.spinIn) return { x: 960 + 12 * Math.sin(t * 0.7), y: 600, zoom: 1.12 + 0.012 * Math.sin(t * 0.9) + 0.03 * L.barPulse(t, 6) };
            if (t < B.pose) {
              const z = L.lerp(1.95, 1.72, L.ease.outCubic(L.seg(t, B.spinIn, B.spinIn + 0.35))) + 0.06 * L.seg(t, B.spinIn + 0.35, B.pose);
              return { x: 960, y: 600, zoom: z };
            }
            const z = L.kf(t, [[B.pose, 1.42], [118.95, 1.4], [119.95, 1.0, "inOutCubic"]]) + 0.06 * Math.exp(-7 * (t - B.pose));
            const y = L.kf(t, [[118.95, 590], [119.95, 540, "inOutCubic"]]);
            return { x: 960, y, zoom: z, shake: 7 * Math.exp(-9 * (t - B.pose)), t };
          };

          const festoon = (ctx, t) => {
            ctx.save();
            ctx.strokeStyle = "#2b366e";
            ctx.lineWidth = 4;
            const fy = (x) => 100 + 64 * Math.sin((x / L.W) * Math.PI);
            ctx.beginPath();
            for (let x = -40; x <= L.W + 40; x += 40) x === -40 ? ctx.moveTo(x, fy(x)) : ctx.lineTo(x, fy(x));
            ctx.stroke();
            const bi = L.beatIndex(t);
            const all = t > B.pose ? Math.exp(-3 * (t - B.pose)) : 0;
            for (let k = 0; k < 24; k++) {
              const x = 20 + k * 82, y = fy(x) + 14;
              const on = (k + bi) % 2 === 0 || all > 0.3;
              const col = [P.amber, P.pink, P.cyan][k % 3];
              L.glow(ctx, x, y, 40, col, on ? 0.55 : 0.2);
              ctx.fillStyle = on ? "#fff6dc" : L.rgba(col, 0.6);
              L.circle(ctx, x, y, 8);
              ctx.fill();
            }
            ctx.restore();
          };

          const FISH = [
            { x: 175, c: "#6fb8ff" }, { x: 520, c: "#ffc85a" }, { x: 800, c: "#ff8fc0" },
            { x: 1120, c: "#6fffc8" }, { x: 1470, c: "#6fb8ff" }, { x: 1760, c: "#ff8fc0" },
          ];
          const PARC = [
            { x: 250, y: FEET - 43, rot: -0.04, label: "payload" },
            { x: 410, y: FEET - 43, rot: 0.05, label: "args" },
            { x: 330, y: FEET - 133, rot: -0.08, label: "result" },
          ];

          const stage = (ctx, t) => {
            skyBg(ctx);
            const cam = stageCam(t);
            L.cam(ctx, cam);
            stars(ctx, t, { n: 70, seed: 33, h: 520 });
            moon(ctx, 960, 440, 210);
            ctx.save();
            ctx.translate(0, 300);
            C.city(ctx, t, { y: 1080, lit: 0.7, keys: true, scroll: 900 });
            ctx.restore();
            C.stageFloor(ctx, 800);
            festoon(ctx, t);

            const bi = L.beatIndex(t);
            const kick = kickEnv(t);
            const kicking = t >= B.kick0 && t < B.pose;
            const posed = t >= B.pose;
            const sw = L.sway(t);

            // spotlights: sweep with the swing, all converge on her for the big pose
            const conv = posed ? 1 : L.ep(t, B.pose - 0.25, B.pose, "inQuad");
            const spot = (srcX, base, amp, ph, col) =>
              C.spotlight(ctx, L.lerp(base + amp * Math.sin(L.bp(t) * Math.PI * 0.5 + ph), 960, conv), FEET + 10, {
                w: L.lerp(400, 520, conv), alpha: 0.15 + 0.08 * L.pulse(t, 5) + 0.1 * conv, top: -40, srcX, color: col,
              });
            spot(220, 700, 380, 0, "#bfe9ff");
            spot(1700, 1220, 380, Math.PI, "#ffd1ea");
            C.spotlight(ctx, 960, FEET + 10, { w: 480, alpha: 0.26 + 0.12 * L.pulse(t, 5), top: -40 });
            if (posed) {
              const k = Math.exp(-2.5 * (t - B.pose));
              L.burst(ctx, 960, 560, { n: 30, rot: t * 0.3, alpha: 0.08 + 0.2 * k, color: P.json, r0: 200 });
            }

            // --- fishlings: floating back row, hopping in a wave ---
            FISH.forEach((f, i) => {
              let dy = 0;
              if (kicking) dy = -Math.exp(-5 * Math.max(0, L.sinceBeat(t) - 0.04 * i)) * 34 * ((bi + i) % 2 ? 0.5 : 1);
              else if (posed) dy = -40 * Math.exp(-4 * (t - B.pose)) * (1 + 0.3 * (i % 2)) - 8 * L.hop(t);
              else dy = -10 * L.bob(t);
              C.fishling(ctx, f.x, 690 + dy + (i % 2) * 24, 0.95, { t, color: f.c, cheer: kicking || posed ? 1 : 0.4, face: posed || i % 2 ? "happy" : "o", flip: f.x > 960 });
            });

            // --- walking bass (steps in place on beats) ---
            C.bass(ctx, 1640, FEET + 6, 0.85, { phase: posed ? 0 : L.bp(t) % 1, pluck: posed ? Math.exp(-2 * (t - B.pose)) : 0.4 * L.pulse(t, 6), t });

            // --- parcels: hop in sequence ---
            PARC.forEach((p, i) => {
              const hop = kicking ? Math.exp(-6 * Math.max(0, L.sinceBeat(t) - 0.05 * i)) * ((bi + i) % 2 ? 1 : 0.3) : posed ? Math.exp(-4 * (t - B.pose)) : 0;
              C.parcel(ctx, p.x, p.y - hop * 26, 0.72, { rot: p.rot + (kicking ? Math.sin(L.bp(t) * Math.PI) * 0.1 : 0), label: p.label, check: posed ? L.seg(t, B.pose + 0.1 * i, B.pose + 0.1 * i + 0.3) : 0 });
            });

            // --- API critter ---
            C.apiBot(ctx, 640, FEET, 1.3, {
              t, face: "happy",
              wave: posed ? 1 : kicking ? 0.5 : 0,
              hop: kicking ? kick * (bi % 2 ? 0.8 : 0.4) : posed ? Math.exp(-4 * (t - B.pose)) : 0.2 * L.hop(t),
              blink: true,
            });

            // --- ERROR friend (happy) ---
            C.errorBug(ctx, 1290, FEET - (kicking ? kick * 26 * (bi % 2 ? 0.4 : 1) : 0), 1.1, { t, mood: "happy", dance: 1, armsUp: posed ? 1 : kicking ? (bi % 2 ? 0.6 : 0) : 0.2 });

            // --- her ---
            const g = C.groove(t, "swing", 0.9);
            let pose, spinX = 1;
            if (t < B.kick0) {
              pose = { ...g, face: "sing", mouth: 0.4 + 0.45 * Math.abs(Math.sin(L.bp(t) * Math.PI)), lArm: 32, lBend: 135, lHold: "mic", rArm: 70 + sw * 30, rBend: 25 };
            } else if (t < B.spinIn) {
              const left = bi % 2 === 0;
              pose = {
                ...g,
                rot: 0.04 * (left ? -1 : 1) * kick,
                dy: -kick * 22,
                sq: 1 + 0.06 * kick,
                face: "happy", mouth: 0.55 + 0.3 * kick,
                lArm: 128, lBend: 25, lHold: "mic", rArm: 128, rBend: 25,
                legL: left ? 58 * kick : 4, legR: left ? 4 : 58 * kick,
                skirtFlare: 0.6 * kick,
              };
            } else if (t < B.spin0) {
              // wink to camera on the punch-in
              pose = { ...g, face: "wink", sparkle: true, mouth: 0.5, blush: 1.4, lArm: 32, lBend: 135, lHold: "mic", rArm: 150, rBend: 70, headTilt: -0.1, ahoge: 1 };
            } else if (t < B.spin1) {
              const u = L.seg(t, B.spin0, B.spin1);
              const th = TAU * 2 * L.ease.inOutQuad(u);
              const c = Math.cos(th);
              spinX = (c < 0 ? -1 : 1) * (0.28 + 0.72 * Math.abs(c));
              pose = { ...g, rot: 0, face: "happy", mouth: 0.6, lArm: 100, lBend: 15, lHold: "mic", rArm: 100, rBend: 15, hair: Math.sin(th) * 1, tail: Math.sin(th) * 30, skirtFlare: 1.8 * Math.sin(u * Math.PI), dy: -Math.sin(u * Math.PI) * 20, legL: 10, legR: 10 };
            } else if (t < B.pose) {
              const c = L.ep(t, B.spin1, B.pose, "outQuad");
              pose = { ...g, rot: 0, face: "determined", mouth: 0, sq: 1 + 0.14 * c, dy: 12 * c, lArm: 20, lBend: 60, lHold: "mic", rArm: 20, rBend: 60, ears: -20 * c, legL: 8, legR: 8, blush: 1.2 };
            } else {
              const jump = Math.sin(Math.PI * L.seg(t, B.pose, B.pose + 0.34));
              const wk = t > 122.18 && t < 122.5;
              pose = {
                ...g,
                rot: 0.03 * sw,
                dy: -jump * 70 - 6 * L.bob(t),
                sq: 1 - 0.08 * jump + 0.04 * L.pulse(t, 6),
                face: wk ? "wink" : "open", sparkle: true, mouth: 0.8, blush: 1.4,
                lArm: 155, lBend: -8, lHold: "mic", rArm: 150, rBend: -8,
                legL: 4, legR: 46 + 6 * L.sway(t), ears: -18 * L.pulse(t, 5), skirtFlare: 0.8,
              };
            }
            // glow behind her so the navy hair always reads
            L.glow(ctx, 960, 620, 420, "#cfe0ff", 0.12);
            ctx.save();
            ctx.translate(960, FEET);
            ctx.scale(spinX, 1);
            C.fish(ctx, { ...pose, x: 0, y: 0, s: 1.3 });
            ctx.restore();
            if (t >= B.spin0 && t < B.spin1) {
              // spin swirls
              const u = L.seg(t, B.spin0, B.spin1);
              const sp = Math.sin(u * Math.PI);
              ctx.save();
              ctx.lineCap = "round";
              for (let k = 0; k < 4; k++) {
                const yy = FEET - 90 - k * 110;
                const a0 = t * 14 + k * 1.7;
                ctx.strokeStyle = L.rgba(k % 2 ? P.cyan : "#ffffff", 0.75 * sp);
                ctx.lineWidth = 7;
                ctx.beginPath();
                ctx.ellipse(960, yy, 190 + k * 12, 34, 0, a0, a0 + 2.2);
                ctx.stroke();
              }
              ctx.restore();
            }
            if (t >= B.spinIn && t < B.spin0) L.sparkle(ctx, 1010, 290, 36 * L.ease.outBack(L.seg(t, B.spinIn, B.spinIn + 0.25)), "#fff");
            if (kicking && t < B.spinIn) {
              // jazz-hands sparkles on the beat
              L.sparkle(ctx, 960 - 150, FEET - 350 - kick * 22, 30 * kick, P.json);
              L.sparkle(ctx, 960 + 150, FEET - 350 - kick * 22, 30 * kick, P.cyan);
            }

            // --- confetti: steady rain + cannons on the big pose ---
            const rain = L.seg(t, T0 - 1, T0 + 0.5);
            for (let i = 0; i < 110; i++) {
              const v = 110 + 90 * L.hash(i * 3.3);
              const period = 1400 / v;
              const ph = ((t - T0) / period + L.hash(i * 7.1)) % 1;
              const x = L.hash(i * 11.7) * 2100 - 90 + Math.sin(t * (0.8 + L.hash(i)) + i) * 40;
              const y = -120 + ph * 1400;
              confettiPiece(ctx, x, y, i, t, rain);
            }
            if (posed) {
              const tau = t - B.pose, k = 2.2;
              const f = (1 - Math.exp(-k * tau)) / k;
              for (let i = 0; i < 140; i++) {
                const side = i % 2 ? 1 : -1;
                const x0 = side < 0 ? 60 : 1860, y0 = 820;
                const ang = -Math.PI / 2 + side * -(0.25 + 0.5 * L.hash(i * 1.7));
                const spd = 1500 + 1300 * L.hash(i * 2.9);
                const x = x0 + Math.cos(ang) * spd * f + Math.sin(tau * 3 + i) * 20 * Math.min(1, tau);
                const y = y0 + Math.sin(ang) * spd * f + 110 * tau;
                if (y > 1150) continue;
                confettiPiece(ctx, x, y, i + 300, t, 1.2);
              }
              // flash
              if (tau < 0.35) L.glow(ctx, 960, 560, 650, "#fff6dc", 0.55 * (1 - tau / 0.35));
            }
            L.camEnd(ctx);
          };

          /* ================= 9a ================= */
          const shotA = (ctx, t) => stage(ctx, t);

          /* ================= 9b : pull back into the chat window ================= */
          const WX = 330, WY = 26, WW = 1260, WH = 880;
          const CARD = { x: WX + 110, y: 226, w: 608, h: 342 };
          const Z0 = L.W / CARD.w;
          const chatBg = (ctx, t) => {
            const g = ctx.createRadialGradient(960, 480, 50, 960, 480, 1200);
            g.addColorStop(0, "#1c2b72");
            g.addColorStop(0.5, P.night1);
            g.addColorStop(1, P.night0);
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, L.W, L.H);
            L.bubbles(ctx, t, { n: 22, seed: 9, speed: 45, alpha: 0.3, rMax: 14 });
          };
          const chatBubble = (ctx, who, text, y, fs, pop, p = 1) => {
            if (pop <= 0) return;
            ctx.save();
            ctx.font = `600 ${fs}px "${L.FONT.round}", "${L.FONT.zh}", sans-serif`;
            const tw = Math.max(ctx.measureText(text).width, fs * 1.4);
            const bw = tw + 56, bh = fs + 40;
            const isUser = who === "user";
            const bx = isUser ? WX + WW - bw - 40 : WX + 110;
            const sc = L.ease.outBack(L.clamp(pop));
            const ox = isUser ? bx + bw : bx, oy = y + bh;
            ctx.translate(ox, oy);
            ctx.scale(sc, sc);
            ctx.translate(-ox, -oy);
            L.rr(ctx, bx, y, bw, bh, 24);
            ctx.fillStyle = isUser ? "#2c4bb8" : "#f3f6ff";
            ctx.fill();
            if (!isUser) {
              ctx.fillStyle = "#1f2b5e";
              L.circle(ctx, WX + 64, y + bh / 2, 32);
              ctx.fill();
              C.whaleIcon(ctx, WX + 64, y + bh / 2 + 4, 0.62, P.cyan, false);
            }
            const shown = text.slice(0, Math.round(text.length * L.clamp(p)));
            L.text(ctx, shown, bx + 28, y + bh / 2 + 1, { size: fs, color: isUser ? "#fff" : "#1a2255", align: "left", weight: 600 });
            ctx.restore();
            return { bx, bw, bh };
          };
          const REPLY = "工具调用 0 次 · 歌曲 1 首";
          const ENCORE = "……好吧，再唱一遍";
          const chatScene = (ctx, t) => {
            chatBg(ctx, t);
            const e = L.ep(t, 120.118, 121.0, "inOutCubic");
            const z = Math.pow(Z0, 1 - e);
            const cw = [CARD.x + CARD.w / 2, CARD.y + CARD.h / 2];
            const sx = L.lerp(960, cw[0], e), sy = L.lerp(540, cw[1], e);
            ctx.save();
            ctx.translate(sx, sy);
            ctx.scale(z, z);
            ctx.translate(-cw[0], -cw[1]);
            // window + the original request (the bookend from ch1)
            L.glow(ctx, WX + WW / 2, WY + WH / 2, 700, P.cyan, 0.12);
            const typed = L.seg(t, 121.0, 121.55);
            const sent = t >= 121.719;
            C.chatWindow(ctx, WX, WY, WW, WH, {
              t,
              title: "Whale Chat",
              msgs: [{ who: "user", text: "帮我调用一下天气工具", size: 36 }],
              inputText: sent ? "" : typed > 0 ? ENCORE.slice(0, Math.round(ENCORE.length * typed)) : "输入消息…",
              inputGlow: !sent && typed > 0 ? 0.6 + 0.4 * L.pulse(t, 6) : 0,
            });
            // send-button flash
            if (t > 121.6 && t < 122.1) {
              const k = L.seg(t, 121.6, 122.1);
              L.glow(ctx, WX + WW - 72, WY + WH - 64, 120, P.cyan, 0.8 * Math.sin(k * Math.PI));
            }
            // her avatar + the show, as a media card
            ctx.fillStyle = "#1f2b5e";
            L.circle(ctx, WX + 64, CARD.y + 36, 32);
            ctx.fill();
            C.whaleIcon(ctx, WX + 64, CARD.y + 40, 0.62, P.cyan, false);
            const r = 22 * e;
            ctx.save();
            L.rr(ctx, CARD.x, CARD.y, CARD.w, CARD.h, Math.max(0.01, r));
            ctx.clip();
            ctx.translate(CARD.x, CARD.y);
            ctx.scale(CARD.w / L.W, CARD.h / L.H);
            stage(ctx, t);
            ctx.restore();
            if (e > 0) {
              ctx.save();
              L.rr(ctx, CARD.x, CARD.y, CARD.w, CARD.h, Math.max(0.01, r));
              ctx.lineWidth = 4;
              ctx.strokeStyle = L.rgba("#8fb6ff", e);
              ctx.stroke();
              // tiny "play again" tag on the card
              ctx.globalAlpha *= e;
              L.rr(ctx, CARD.x + CARD.w - 126, CARD.y + 14, 112, 40, 20);
              ctx.fillStyle = "rgba(8,12,40,0.8)";
              ctx.fill();
              ctx.fillStyle = P.mint;
              ctx.beginPath();
              ctx.moveTo(CARD.x + CARD.w - 106, CARD.y + 24);
              ctx.lineTo(CARD.x + CARD.w - 88, CARD.y + 34);
              ctx.lineTo(CARD.x + CARD.w - 106, CARD.y + 44);
              ctx.fill();
              L.text(ctx, "2:04", CARD.x + CARD.w - 50, CARD.y + 35, { size: 22, font: L.FONT.mono, color: P.mint, weight: 700 });
              ctx.restore();
            }
            // her reply, then the user gives up and asks for an encore
            chatBubble(ctx, "fish", REPLY, 592, 44, L.seg(t, 120.79, 121.05), L.seg(t, 120.85, 121.25) + 0.001);
            if (sent) chatBubble(ctx, "user", ENCORE, 700, 44, L.seg(t, 121.719, 121.95));
            // she's delighted: notes burst off her reply on the downbeat 122.18
            const nb = t - 122.183;
            if (nb > 0) {
              for (let i = 0; i < 6; i++) {
                const a = -Math.PI * (0.15 + 0.7 * (i / 5));
                const d = 60 + 260 * L.ease.outCubic(L.clamp(nb / 0.6));
                ctx.save();
                ctx.globalAlpha *= 1 - L.seg(nb, 0.35, 0.6);
                L.note(ctx, 860 + Math.cos(a) * d, 610 + Math.sin(a) * d * 0.8, 46, [P.cyan, P.pink, P.json][i % 3], i % 2 === 0, Math.sin(nb * 8 + i) * 0.3);
                ctx.restore();
              }
              L.sparkle(ctx, WX + 64, 634, 40 * Math.exp(-5 * nb), "#fff");
            }
            ctx.restore();
          };
          const shotB = (ctx, t) => chatScene(ctx, t);

          /* ================= 9c : end card ================= */
          // neon tube text without shadowBlur (L.neonText's blur + 4 wide strokes cost ~28 ms at this size)
          const neonTitle = (ctx, str, x, y, size, col, on) => {
            ctx.save();
            ctx.font = `400 ${size}px "${L.FONT.script}", sans-serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.lineJoin = "round";
            ctx.lineCap = "round";
            if (on < 1) {
              ctx.strokeStyle = L.rgba(col, 0.25);
              ctx.lineWidth = size * 0.07;
              ctx.strokeText(str, x, y);
            }
            if (on > 0) {
              ctx.globalAlpha *= on;
              ctx.strokeStyle = L.rgba(col, 0.07);
              ctx.lineWidth = size * 0.26;
              ctx.strokeText(str, x, y);
              ctx.strokeStyle = L.rgba(col, 0.13);
              ctx.lineWidth = size * 0.15;
              ctx.strokeText(str, x, y);
              ctx.strokeStyle = col;
              ctx.lineWidth = size * 0.08;
              ctx.strokeText(str, x, y);
              ctx.strokeStyle = "#fff4fa";
              ctx.lineWidth = size * 0.028;
              ctx.strokeText(str, x, y);
            }
            ctx.restore();
          };
          const endCard = (ctx, t) => {
            const g = ctx.createRadialGradient(960, 420, 60, 960, 520, 1250);
            g.addColorStop(0, "#27398a");
            g.addColorStop(0.22, "#1c2a70");
            g.addColorStop(0.55, P.night1);
            g.addColorStop(1, P.night0);
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, L.W, L.H);
            stars(ctx, t, { n: 90, seed: 51, a: 0.8 });
            L.bubbles(ctx, t, { n: 18, seed: 14, speed: 32, alpha: 0.25, rMax: 12 });
            const zoomIn = 1 + 0.03 * L.seg(t, 122.6, T1);
            ctx.save();
            ctx.translate(960, 540);
            ctx.scale(zoomIn, zoomIn);
            ctx.translate(-960, -540);

            // neon title (flickers on at 122.65, steady from ~122.85)
            const ig = t - 122.648;
            const on = ig < 0 ? 0 : ig < 0.2 ? (Math.sin(ig * 90) > 0 ? 1 : 0.25) : 1;
            const pop = L.ease.outBack(L.seg(t, 122.62, 122.9));
            ctx.save();
            ctx.translate(960, 360);
            ctx.scale(0.85 + 0.15 * pop, 0.85 + 0.15 * pop);
            L.glow(ctx, 0, 0, 620, P.pink, 0.16 * on);
            neonTitle(ctx, "Let Me Go", 0, 0, 210, P.pink, on * (0.94 + 0.06 * Math.sin(t * 7)));
            ctx.restore();
            const fade = (a, b) => L.seg(t, a, b);
            L.text(ctx, "（共创版）", 960, 505, { size: 58, font: L.FONT.zh, weight: 600, color: "#d7e4ff", alpha: fade(122.7, 122.88) });
            L.text(ctx, "罐装毕加索", 960, 612, { size: 84, font: L.FONT.zh, weight: 700, color: "#f5f8ff", tracking: 14, alpha: fade(122.75, 122.92) });
            // divider with the whale
            const dv = L.ease.outCubic(fade(122.72, 123.0));
            ctx.save();
            ctx.strokeStyle = L.rgba(P.gold, 0.85);
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(960 - 60, 700);
            ctx.lineTo(960 - 60 - 360 * dv, 700);
            ctx.moveTo(960 + 60, 700);
            ctx.lineTo(960 + 60 + 360 * dv, 700);
            ctx.stroke();
            ctx.restore();
            C.whaleIcon(ctx, 960, 704, 0.9 * dv, P.gold, true);
            L.text(ctx, "原作 @星落落_oi  ·  词 DeepSeek  ·  曲 Suno / 豆包  ·  MV 画面全部由代码绘制", 960, 772, {
              size: 32, font: L.FONT.round, weight: 500, color: "#b8c6f0", alpha: fade(122.78, 122.95),
            });

            // tiny chibi her waving (left) + the whale icon spouting (right)
            const inL = L.ease.outBack(fade(122.65, 122.95));
            const wave = Math.sin(t * 9);
            L.glow(ctx, 320, 470, 300, "#cfe0ff", 0.26 * inL);
            C.fish(ctx, {
              ...C.groove(t, "swing", 0.6),
              x: 320, y: 585 + (1 - inL) * 60, s: 0.76 * Math.max(0.05, inL),
              face: t > 123.55 && t < 123.9 ? "wink" : "happy", mouth: 0.6, blush: 1.3,
              lArm: 32, lBend: 135, lHold: "mic",
              rArm: 150 + 18 * wave, rBend: 20 + 25 * wave,
            });
            const inR = L.ease.outBack(fade(122.7, 123.0));
            const bob = Math.sin(t * 2.4) * 8;
            L.glow(ctx, 1590, 470, 260, P.cyan, 0.16 * inR);
            C.whaleIcon(ctx, 1590, 480 + bob, 3.2 * Math.max(0.05, inR), P.cyan, true);
            // spout bubbles/notes on the beats 123.09 / 123.55
            for (const bt of [123.089, 123.553]) {
              const a = t - bt;
              if (a < 0 || a > 1.2) continue;
              for (let i = 0; i < 3; i++) {
                ctx.save();
                ctx.globalAlpha *= 1 - a / 1.2;
                L.note(ctx, 1560 + (i - 1) * 50 + Math.sin(a * 5 + i) * 10, 360 + bob - a * 160 - i * 18, 34, [P.cyan, P.pink, P.json][i], i === 1, 0.2);
                ctx.restore();
              }
            }
            ctx.restore();
          };
          const shotC = (ctx, t) => {
            // iris opens from the centre over the frozen chat frame
            const k = L.ease.inOutCubic(L.seg(t, 122.6, 122.86));
            if (k < 1) chatScene(ctx, 122.6);
            ctx.save();
            const R = 1120 * k;
            if (k < 1) {
              L.circle(ctx, 960, 540, R);
              ctx.clip();
            }
            endCard(ctx, t);
            ctx.restore();
            if (k > 0 && k < 1) {
              ctx.save();
              ctx.strokeStyle = P.cyan;
              ctx.lineWidth = 10;
              L.circle(ctx, 960, 540, R);
              ctx.stroke();
              ctx.restore();
            }
          };

          L.mountChapter({
            id: ID,
            t0: T0,
            dur: T1 - T0,
            shots: [
              { a: T0, b: 120.118, draw: shotA },
              { a: 120.118, b: 122.6, draw: shotB },
              { a: 122.6, b: T1, draw: shotC },
            ],
            post: (ctx) => L.vignette(ctx, 0.5),
          });
        })();
      </script>
    </template>
  </body>
</html>
